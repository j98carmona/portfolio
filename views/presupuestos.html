    <meta charset="UTF-8">

    <meta name="description"
        content="Solicita tu presupuesto web a Jorge Carmona, desarrollador en Valencia. Elige el tipo de proyecto y los extras que necesitas y te responderé sin compromiso.">
    <!-- Las rutas empiezan por ../ porque esta página está dentro de la carpeta views -->
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>
    <!-- Encabezado de la página -->
    <header>
        <a href="../index.html">Jorge Carmona</a>
        <nav>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <!-- La clase "active" se utiliza para resaltar la página actual -->
                <li><a href="presupuestos.html" class="active">Presupuestos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <!-- Formulario para solicitar un presupuesto -->
        <section>
            <h1>Solicita tu presupuesto</h1>
            <p>Cuéntame qué necesitas y te enviaré un presupuesto sin compromiso.</p>
            <form action="#" method="post">
                <p>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </p>
                <p>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="mensaje">Describe tu proyecto:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
                </p>
                <p>
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono">
                </p>
                <!-- Lista desplegable con el tipo de proyecto -->
                <p>
                    <label for="tipo">Tipo de proyecto:</label>
                    <select id="tipo" name="tipo">
                        <option value="presentacion">Web de presentación</option>
                        <option value="tienda">Tienda online</option>
                        <option value="portfolio">Portfolio</option>
                    </select>
                </p>
                <!-- Casillas de extras (opcionales) -->
                <fieldset>
                    <legend>Extras que te interesan:</legend>
                    <p>
                        <input type="checkbox" id="seo" name="extras" value="seo">
                        <label for="seo">Optimización SEO</label>
                    </p>
                    <p>
                        <input type="checkbox" id="logo" name="extras" value="logo">
                        <label for="logo">Diseño de logotipo</label>
                    </p>
                    <p>
                        <input type="checkbox" id="mantenimiento" name="extras" value="mantenimiento">
                        <label for="mantenimiento">Mantenimiento mensual</label>
                    </p>
                </fieldset>
                <!-- Casilla de privacidad obligatoria -->
                <p>
                    <input type="checkbox" id="privacidad" name="privacidad" required>
                    <label for="privacidad">He leído y acepto el <a href="aviso-legal.html">aviso legal</a></label>
                </p>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>
    <!-- Pie de página con la dirección, redes sociales y aviso legal -->

        </ul>
        <a href="aviso-legal.html">Aviso legal</a>
    </footer>
</body>
